<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08141c"/>
      <stop offset="0.55" stop-color="#0f2f3f"/>
      <stop offset="1" stop-color="#1b5a73"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fe3c1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4fe3c1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff0d6"/>
      <stop offset="1" stop-color="#2aa6c9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9fe8ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <!-- circuit lines -->
  <g fill="none" stroke="#7ff0d6" stroke-opacity="0.35" stroke-width="2">
    <polyline points="900,60 1000,60 1040,100 1160,100"/>
    <polyline points="860,380 980,380 1020,340 1120,340"/>
    <polyline points="1500,90 1440,90 1400,130 1380,130"/>
    <polyline points="1560,330 1480,330 1440,290 1400,290"/>
    <polyline points="1000,220 1090,220"/>
  </g>
  <g fill="#7ff0d6" fill-opacity="0.8">
    <circle cx="900" cy="60" r="5"/><circle cx="1160" cy="100" r="5"/>
    <circle cx="860" cy="380" r="5"/><circle cx="1120" cy="340" r="5"/>
    <circle cx="1500" cy="90" r="5"/><circle cx="1380" cy="130" r="5"/>
    <circle cx="1560" cy="330" r="5"/><circle cx="1400" cy="290" r="5"/>
    <circle cx="1000" cy="220" r="5"/>
  </g>

  <!-- shield -->
  <circle cx="1250" cy="220" r="200" fill="url(#glow)"/>
  <path d="M1250 100 L1350 138 V230 C1350 292 1308 340 1250 362 C1192 340 1150 292 1150 230 V138 Z"
        fill="url(#shield)" fill-opacity="0.16" stroke="url(#shield)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1250 124 L1328 153 V230 C1328 278 1296 315 1250 334 C1204 315 1172 278 1172 230 V153 Z"
        fill="none" stroke="#7ff0d6" stroke-opacity="0.35" stroke-width="2"/>
  <!-- keyhole -->
  <circle cx="1250" cy="206" r="24" fill="#7ff0d6"/>
  <path d="M1238 222 H1262 L1270 272 H1230 Z" fill="#7ff0d6"/>

  <!-- text -->
  <text x="80" y="168" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-weight="700" font-size="86" fill="#ffffff">Salma Rezgui</text>
  <text x="84" y="232" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-weight="600" font-size="34" fill="#7ff0d6">DevSecOps  ·  Explainable AI  ·  Secure Systems</text>
  <text x="84" y="282" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="25" fill="#cfe3ea">Élève ingénieure @ ENSI  ·  3e de promotion</text>

  <!-- chips -->
  <g font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="21" font-weight="600">
    <rect x="84" y="320" width="150" height="46" rx="23" fill="#7ff0d6" fill-opacity="0.14" stroke="#7ff0d6" stroke-opacity="0.6"/>
    <text x="159" y="351" text-anchor="middle" fill="#7ff0d6">CI/CD</text>
    <rect x="252" y="320" width="150" height="46" rx="23" fill="#7ff0d6" fill-opacity="0.14" stroke="#7ff0d6" stroke-opacity="0.6"/>
    <text x="327" y="351" text-anchor="middle" fill="#7ff0d6">SHAP·LIME</text>
    <rect x="420" y="320" width="200" height="46" rx="23" fill="#2c9cc4" fill-opacity="0.25" stroke="#7fd0ee" stroke-opacity="0.7"/>
    <text x="520" y="351" text-anchor="middle" fill="#bfeaf8">Open to PFE</text>
  </g>
</svg>
